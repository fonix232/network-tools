# /data/custom/macvlan-shims.conf — read by /data/on_boot.d/10-setup-network.sh
#
# One host-side macvlan shim entry per line. The script creates <bridge>.mac,
# assigns the shim IP (noprefixroute), and adds a /32 (/128) route to the
# container IP. Multiple lines may share a bridge (one shim, several routes).
# Use '-' for the IPv6 columns to skip IPv6.
#
# bridge   container-ipv4   shim-ipv4/prefix   container-ipv6   shim-ipv6/prefix
br500      10.10.5.5        10.10.5.1/24       fdab:420::5      fdab:420::1/64
