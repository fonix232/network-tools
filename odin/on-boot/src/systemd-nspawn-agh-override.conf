# /etc/systemd/system/systemd-nspawn@agh.service.d/override.conf
# AGH is the network's DNS server — keep retrying forever. Covers the boot
# race where machines.target fires before UniFi provisioning creates br500
# (MACVLAN parent), and any transient crash.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=15
