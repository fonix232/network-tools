# /etc/systemd/system/udm-boot.service.d/wait-for-dpkg-restore.conf
#
# ubnt-dpkg-restore.service reinstalls cached user packages after a firmware
# update and holds the dpkg lock while doing so. Without this ordering,
# 0-setup-system.sh races it, fails its package restore, and the AGH machine
# (the network's DNS) never starts.
#
# This is our own fix — proposed upstream as unifi-common-addons issue #1,
# closed "not planned". Canonical copy lives here; deploy.sh reinstalls it.
[Unit]
After=ubnt-dpkg-restore.service
