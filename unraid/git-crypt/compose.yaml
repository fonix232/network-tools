services:
  build:
    build:
      context: ../..
      dockerfile: unraid/common/Dockerfile.builder
    platform: linux/amd64
    volumes:
      - ../..:/workspace
    environment:
      BUILD_COMMAND: python3 unraid/git-crypt/assemble.py --version "$$VERSION" --output unraid/git-crypt/git-crypt.plg
