services:
  build:
    build:
      context: ../..
      dockerfile: unraid/common/Dockerfile.builder
    platform: linux/amd64
    volumes:
      - ../..:/workspace
    environment:
      BUILD_COMMAND: python3 unraid/komodo-periphery/assemble.py --version "$$VERSION" --output unraid/komodo-periphery/komodo-periphery.plg
