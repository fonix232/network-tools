name: Build unraid/git-crypt

on:
  push:
    branches: [main]
    paths:
      - 'unraid/git-crypt/src/**'
      - 'unraid/git-crypt/manifest.json'
      - 'unraid/common/**'
      - '.github/workflows/build-unraid-git-crypt.yml'
      - '.github/workflows/reusable-build-release.yml'
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-build-release.yml
    permissions:
      contents: write
    with:
      component_label: unraid/git-crypt
      tag_prefix: unraid-git-crypt
      build_working_directory: unraid/git-crypt
      build_command: python3 ../common/assemble.py --version "$VERSION"
      artifact_path: unraid/git-crypt/git-crypt.plg
      publish_path: plugins/git-crypt.plg
      extra_release_notes: |
        Install via Unraid Plugins > Install Plugin using:
        https://raw.githubusercontent.com/fonix232/network-tools/main/plugins/git-crypt.plg

        That URL always serves the newest build, and Unraid's plugin update
        checker uses it to offer future updates automatically. The .plg attached
        to this release is the pinned copy of this specific version.
    secrets: inherit
