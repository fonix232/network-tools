name: Build unraid/komodo-periphery

on:
  push:
    branches: [main]
    paths:
      - 'unraid/komodo-periphery/src/**'
      - 'unraid/komodo-periphery/manifest.json'
      - 'unraid/common/**'
      - '.github/workflows/build-unraid-komodo-periphery.yml'
      - '.github/workflows/reusable-build-release.yml'
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-build-release.yml
    permissions:
      contents: write
    with:
      component_label: unraid/komodo-periphery
      tag_prefix: unraid-komodo-periphery
      build_working_directory: unraid/komodo-periphery
      build_command: python3 ../common/assemble.py --version "$VERSION"
      artifact_path: unraid/komodo-periphery/komodo-periphery.plg
      publish_path: plugins/komodo-periphery.plg
      extra_release_notes: |
        Install via Unraid Plugins > Install Plugin using:
        https://raw.githubusercontent.com/fonix232/network-tools/main/plugins/komodo-periphery.plg

        That URL always serves the newest build, and Unraid's plugin update
        checker uses it to offer future updates automatically. The .plg attached
        to this release is the pinned copy of this specific version.
    secrets: inherit
