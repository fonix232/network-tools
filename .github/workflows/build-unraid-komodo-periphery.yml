name: Build unraid/komodo-periphery

on:
  push:
    branches: [main]
    paths:
      - 'unraid/komodo-periphery/src/**'
      - 'unraid/komodo-periphery/manifest.json'
      - 'unraid/common/**'
      - '.github/workflows/build-unraid-komodo-periphery.yml'
      - '.github/workflows/reusable-build-release.yml'
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-build-release.yml
    permissions:
      contents: write
    with:
      component_label: unraid/komodo-periphery
      tag_prefix: unraid-komodo-periphery
      build_working_directory: unraid/komodo-periphery
      build_command: python3 ../common/assemble.py --version "$VERSION"
      artifact_path: unraid/komodo-periphery/komodo-periphery.plg
      extra_release_notes: |
        Install via Unraid Plugins > Install Plugin using the released .plg URL from this release.
    secrets: inherit
