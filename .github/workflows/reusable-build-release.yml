name: Reusable plugin build/release

on:
  workflow_call:
    inputs:
      component_label:
        description: Human-readable component label for release name
        required: true
        type: string
      tag_prefix:
        description: Prefix for release tag, e.g. unraid-komodo-periphery
        required: true
        type: string
      artifact_path:
        description: File/glob paths to upload and attach to release
        required: true
        type: string
      build_working_directory:
        description: Working directory for build command
        required: false
        default: .
        type: string
      build_command:
        description: Optional build command to run before upload/release
        required: false
        default: ""
        type: string
      extra_release_notes:
        description: Optional extra release notes appended after autogenerated summary
        required: false
        default: ""
        type: string
      publish_path:
        description: >
          Optional repo path to publish the built artifact to on the default
          branch, e.g. plugins/gnupg2.plg. This is the stable URL Unraid's
          plugin update checker fetches via the plugin's pluginURL attribute,
          so it must always carry the newest release.
        required: false
        default: ""
        type: string
      publish_source:
        description: >
          File to copy to publish_path. Only needed when artifact_path is a
          glob (multiple release assets); defaults to artifact_path.
        required: false
        default: ""
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version variables
        id: vars
        run: |
          VER="$(date -u +%Y.%m.%d)"
          TAG="${{ inputs.tag_prefix }}-$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        if: ${{ inputs.build_command != '' }}
        working-directory: ${{ inputs.build_working_directory }}
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: ${{ inputs.build_command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag_prefix }}-${{ steps.vars.outputs.version }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error

      - name: Generate release notes from triggering commit
        id: notes
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          MSG="$COMMIT_MSG"
          if [ -z "$MSG" ]; then
            MSG="$(git log -1 --pretty=%B)"
          fi

          # Extract commit body (everything after first blank line). If absent, use full message.
          BODY="$(printf '%s' "$MSG" | awk 'BEGIN{blank=0} NR==1{next} { if ($0=="") { blank=1; next } if (blank) print }')"
          if [ -z "$BODY" ]; then
            BODY="$MSG"
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            if [ -n "${{ inputs.extra_release_notes }}" ]; then
              echo
              echo "${{ inputs.extra_release_notes }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ inputs.component_label }} ${{ steps.vars.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ inputs.artifact_path }}

      # Unraid's plugin update checker fetches the URL in the installed .plg's
      # pluginURL attribute and compares its version attribute against the
      # installed one. That URL has to be stable, which rules out
      # releases/latest/download — "latest" resolves across the whole repo, so
      # with several components releasing here it would usually point at the
      # wrong component's release. Publishing the built .plg to a fixed path on
      # the default branch gives each plugin its own permanent raw URL instead.
      - name: Publish plugin file for the Unraid updater
        if: ${{ inputs.publish_path != '' }}
        env:
          PUBLISH_PATH: ${{ inputs.publish_path }}
          PUBLISH_SOURCE: ${{ inputs.publish_source }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          SOURCE="${PUBLISH_SOURCE:-$ARTIFACT_PATH}"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::publish_path is set but publish source '$SOURCE' is not a single file"
            exit 1
          fi

          staged="$(mktemp)"
          cp "$SOURCE" "$staged"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sibling plugin builds triggered by the same push race for this
          # branch, so re-base onto whatever landed and try again.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$DEFAULT_BRANCH"
            git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

            mkdir -p "$(dirname "$PUBLISH_PATH")"
            cp "$staged" "$PUBLISH_PATH"
            git add -f "$PUBLISH_PATH"

            if git diff --cached --quiet; then
              echo "$PUBLISH_PATH already up to date, nothing to publish."
              exit 0
            fi

            git commit -q -m "chore($TAG_PREFIX): publish $VERSION for the Unraid plugin updater [skip ci]"
            if git push origin "$DEFAULT_BRANCH"; then
              echo "Published $PUBLISH_PATH at version $VERSION"
              exit 0
            fi

            echo "Push rejected on attempt $attempt, retrying"
            sleep $((attempt * 5))
          done

          echo "::error::Could not publish $PUBLISH_PATH after 3 attempts"
          exit 1
