name: Build unraid/gnupg2

on:
  push:
    branches: [main]
    paths:
      - 'unraid/gnupg2/src/**'
      - 'unraid/gnupg2/manifest.json'
      - 'unraid/common/**'
      - '.github/workflows/build-unraid-gnupg2.yml'
      - '.github/workflows/reusable-build-release.yml'
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/reusable-build-release.yml
    permissions:
      contents: write
    with:
      component_label: unraid/gnupg2
      tag_prefix: unraid-gnupg2
      build_working_directory: unraid/gnupg2
      build_command: python3 ../common/assemble.py --version "$VERSION"
      artifact_path: unraid/gnupg2/gnupg2.plg
      publish_path: plugins/gnupg2.plg
      extra_release_notes: |
        Install via Unraid Plugins > Install Plugin using:
        https://raw.githubusercontent.com/fonix232/network-tools/main/plugins/gnupg2.plg

        That URL always serves the newest build, and Unraid's plugin update
        checker uses it to offer future updates automatically. The .plg attached
        to this release is the pinned copy of this specific version.
    secrets: inherit
