# Builds self-extracting sysext installers for the last N Komodo releases.
#
#   docker compose run --rm build
#
# Override defaults:
#   RELEASE_COUNT=3 PERIPHERY_ARCH=aarch64 docker compose run --rm build

services:
  build:
    build:
      context: ../..
      dockerfile: truenas/common/Dockerfile.builder
    platform: linux/amd64
    volumes:
      - ../..:/workspace:ro
      - ./output:/output
    environment:
      RELEASE_COUNT: ${RELEASE_COUNT:-6}
      PERIPHERY_ARCH: ${PERIPHERY_ARCH:-x86_64}
      PLUGIN_BUILD_SCRIPT: truenas/komodo-periphery/src/build.sh
      INSTALL_TEMPLATE_PATH: /workspace/truenas/komodo-periphery/src/install.sh
