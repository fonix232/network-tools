# Builds a self-extracting sysext installer for the pinned Komodo release.
#
#   docker compose run --rm build
#
# The version comes from KOMODO_VERSION in the repo-root versions.env.
# Override:
#   KOMODO_VERSION=v2.2.0 docker compose run --rm build   # build another tag
#   RELEASE_COUNT=3 docker compose run --rm build          # ignore the pin
#   PERIPHERY_ARCH=aarch64 docker compose run --rm build

services:
  build:
    build:
      context: ../..
      dockerfile: truenas/common/Dockerfile.builder
    platform: linux/amd64
    volumes:
      - ../..:/workspace:ro
      - ./output:/output
    environment:
      KOMODO_VERSION: ${KOMODO_VERSION:-}
      RELEASE_COUNT: ${RELEASE_COUNT:-}
      PERIPHERY_ARCH: ${PERIPHERY_ARCH:-x86_64}
      PLUGIN_BUILD_SCRIPT: truenas/komodo-periphery/src/build.sh
      INSTALL_TEMPLATE_PATH: /workspace/truenas/komodo-periphery/src/install.sh
